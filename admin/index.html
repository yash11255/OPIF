<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Visitor Logs | OPIF Carbon Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root { --navy:#00163f; --blue:#1e64a0; --bg:#eef3f8; --line:#d0dcea; --border:#c5d8ef; --muted:#4a6a8a; --faint:#7a9abf; --green:#a4cd39; }
* { box-sizing:border-box; }
body { margin:0; font-family:'Roboto',Arial,sans-serif; background:var(--bg); color:#0a2240; }
header { background:#fff; border-bottom:1px solid var(--line); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
header img { height:54px; }
header .t { font:800 18px 'Plus Jakarta Sans',Roboto,sans-serif; color:var(--navy); }
.bar { background:var(--navy); height:6px; }
main { max-width:1280px; margin:0 auto; padding:24px 16px 60px; }
.panel { background:#fff; border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:18px; }
h2 { font-size:15px; color:var(--navy); margin:0 0 12px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:0; background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:18px; }
.tile { padding:16px 18px; border-right:1px solid var(--line); }
.tile:last-child { border-right:none; }
.tile span { display:block; font-size:9.5px; letter-spacing:2px; text-transform:uppercase; color:var(--faint); font-weight:700; margin-bottom:6px; }
.tile b { font:800 28px 'Plus Jakarta Sans',Roboto,sans-serif; color:var(--navy); }
.btn { font:700 13px Roboto,sans-serif; padding:10px 18px; border-radius:9px; border:1px solid var(--border); background:#fff; color:var(--navy); cursor:pointer; min-height:40px; }
.btn.primary { background:var(--navy); color:#fff; border-color:var(--navy); }
.btn.cta { background:var(--green); border-color:var(--green); }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
input { font:15px Roboto,sans-serif; padding:10px 12px; border:1px solid var(--border); border-radius:8px; min-height:40px; }
.wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:top; }
thead th { font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--faint); background:var(--bg); position:sticky; top:0; }
td.ua { white-space:normal; min-width:260px; color:var(--muted); font-size:11.5px; }
.err { color:#b3261e; font-weight:500; }
.muted { color:var(--muted); font-size:13px; }
#login { max-width:420px; margin:60px auto; }
:focus-visible { outline:3px solid #2d7fc1; outline-offset:2px; }
</style>
</head>
<body>
<header><img src="../opif_colored_logo.png" alt="One Purpos India Forum"><span class="t">Carbon Calculator · Visitor Logs</span><img src="../csrbox_colored_logo.png" alt="CSRBOX" style="height:36px"></header>
<div class="bar"></div>
<main>
  <form id="login" class="panel" hidden>
    <h2>Admin sign-in</h2>
    <p class="muted">Enter the ADMIN_PASSWORD set in Vercel.</p>
    <div class="row"><label for="pw" style="position:absolute;left:-9999px">Password</label><input id="pw" type="password" autocomplete="current-password" required style="flex:1"><button class="btn primary">Open logs</button></div>
    <p class="err" id="loginErr" role="alert"></p>
  </form>

  <div id="dash" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:14px">
      <p class="muted" id="updated" style="margin:0"></p>
      <div class="row">
        <button class="btn" id="refresh">Refresh</button>
        <button class="btn cta" id="dl">Download full log file (CSV)</button>
        <button class="btn" id="logout">Sign out</button>
      </div>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="tiles" id="tiles"></div>
    <div class="panel"><h2>Last 30 days</h2><div class="wrap"><table id="daily"></table></div></div>
    <div class="panel">
      <div class="row" style="justify-content:space-between"><h2>Visit history (newest first)</h2>
        <div class="row"><input id="filter" placeholder="Filter by IP, city, device…" aria-label="Filter"><button class="btn" id="prev">Newer</button><button class="btn" id="next">Older</button></div></div>
      <div class="wrap" style="max-height:70vh"><table id="log"></table></div>
      <p class="muted" id="page"></p>
    </div>
  </div>
</main>
<script>
const KEY = 'opif-admin-pw';
const PAGE = 500;
let pw = sessionStorage.getItem(KEY) || '';
let offset = 0, data = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const n = (v) => Number(v || 0).toLocaleString('en-IN');

async function api(qs) {
  const r = await fetch(`/api/logs?${qs}`, { headers: { Authorization: `Bearer ${pw}` } });
  if (r.status === 401) { sessionStorage.removeItem(KEY); pw = ''; show(); throw new Error('Wrong password.'); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `Error ${r.status}`);
  return r;
}

async function load() {
  $('err').textContent = '';
  try {
    data = await (await api(`limit=${PAGE}&offset=${offset}`)).json();
    render();
  } catch (e) { $('err').textContent = e.message; }
}

function render() {
  const s = data.stats, ev = s.events || {};
  const tiles = [['Unique visitors', s.uniqueVisitors], ['Page views', ev.page_view], ['Started calculator', ev.start], ['Calculated', ev.calculate],
    ['Cards downloaded', ev.download_png], ['PDF reports', ev.download_pdf], ['Shared', (ev.share_native || 0) + (ev.share_whatsapp || 0)], ['Log entries', s.logEntries]];
  $('tiles').innerHTML = tiles.map(([l, v]) => `<div class="tile"><span>${l}</span><b>${n(v)}</b></div>`).join('');
  const dcols = ['uniqueVisitors', 'page_view', 'start', 'calculate', 'download_png', 'download_pdf', 'share_whatsapp'];
  $('daily').innerHTML = `<thead><tr><th>Day</th><th>Unique</th><th>Views</th><th>Started</th><th>Calculated</th><th>PNG</th><th>PDF</th><th>WhatsApp</th></tr></thead><tbody>${
    [...data.daily].reverse().map((d) => `<tr><td>${d.day}</td>${dcols.map((c) => `<td>${n(d[c])}</td>`).join('')}</tr>`).join('') || '<tr><td colspan="8">No visits yet.</td></tr>'}</tbody>`;
  renderLog();
  $('updated').textContent = `Updated ${new Date().toLocaleString('en-IN')}`;
}

function renderLog() {
  const f = $('filter').value.trim().toLowerCase();
  const rows = data.entries.filter((e) => !f || JSON.stringify(e).toLowerCase().includes(f));
  $('log').innerHTML = `<thead><tr><th>Time (IST)</th><th>Action</th><th>IP</th><th>Location</th><th>Device</th><th>OS</th><th>Browser</th><th>Screen</th><th>Lang</th><th>Referrer</th><th>Detail</th><th>Visitor</th><th>User agent</th></tr></thead><tbody>${
    rows.map((e) => `<tr><td>${esc(new Date(e.time).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }))}</td><td>${esc(e.event)}</td><td>${esc(e.ip)}</td><td>${esc([e.city, e.region, e.country].filter(Boolean).join(', '))}</td><td>${esc(e.deviceType)}</td><td>${esc(e.os)}</td><td>${esc(e.browser)}</td><td>${esc(e.screen)}</td><td>${esc(e.language)}</td><td>${esc(e.referrer)}</td><td>${esc(e.detail)}</td><td>${esc((e.visitor || '').slice(0, 8))}</td><td class="ua">${esc(e.userAgent)}</td></tr>`).join('') || '<tr><td colspan="13">No entries.</td></tr>'}</tbody>`;
  $('page').textContent = `Showing ${n(offset + 1)}–${n(offset + data.entries.length)} of ${n(data.stats.logEntries)}${f ? ` · ${rows.length} match filter on this page` : ''}`;
  $('prev').disabled = offset === 0;
  $('next').disabled = offset + PAGE >= data.stats.logEntries;
}

function show() {
  $('login').hidden = !!pw; $('dash').hidden = !pw;
  if (pw) load(); else $('pw').focus();
}

$('login').addEventListener('submit', async (e) => {
  e.preventDefault(); pw = $('pw').value; $('loginErr').textContent = '';
  try { await api('limit=1'); sessionStorage.setItem(KEY, pw); show(); } catch (err) { $('loginErr').textContent = err.message; }
});
$('refresh').onclick = load;
$('logout').onclick = () => { sessionStorage.removeItem(KEY); pw = ''; show(); };
$('prev').onclick = () => { offset = Math.max(0, offset - PAGE); load(); };
$('next').onclick = () => { offset += PAGE; load(); };
$('filter').oninput = renderLog;
$('dl').onclick = async () => {
  $('dl').disabled = true;
  try {
    const blob = await (await api('format=csv')).blob();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `opif-visitor-log-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (e) { $('err').textContent = e.message; } finally { $('dl').disabled = false; }
};
show();
</script>
</body>
</html>
